name: Python unit tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MPLBACKEND: Agg
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: >-
          python -m pip install
          pytest coverage nbformat requests pyliftover
          'numpy>=2.2' 'pandas>=2.2' 'pysam>=0.23.3' 'matplotlib>=3.10' 'scipy>=1.17'
      - name: Run offline unit tests with coverage
        run: |
          export MPLCONFIGDIR="$RUNNER_TEMP/matplotlib"
          export COVERAGE_FILE="$RUNNER_TEMP/encode.coverage"
          python -m coverage run \
            --include='downloads/*.py,notebooks/*.py,notebooks/workflow/*.py,data_and_code/picalm/*.py' \
            -m pytest -q -p no:cacheprovider --basetemp="$RUNNER_TEMP/pytest" unit_tests
          python -m coverage report --precision=2 --show-missing --fail-under=90
